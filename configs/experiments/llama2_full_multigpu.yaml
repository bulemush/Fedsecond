extends: ../llama2_heterogeneous_50.yaml
run:
  name: llama2_full_multigpu_seed42
  output_dir: runs/llama2_full_multigpu_seed42
  seed: 42
  diagnostic: false
compression:
  calibration_samples: 512
  device_map: balanced
data:
  max_train_samples_per_task: 5000
training:
  local_epochs: 10
  effective_batch_size: 16
  micro_batch_size: 2
  gradient_accumulation_steps: 8
federated:
  rounds: 10
  client_execution: parallel
  max_parallel_clients: 0
