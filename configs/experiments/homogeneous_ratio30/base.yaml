# Ratio30: request 30% decoder-block removal; LLaMA2-7B keeps 23/32 blocks.
extends: ../llama2_homogeneous_base_len320_mb4.yaml
run:
  name: llama2_fedproxy_homogeneous_ratio30_template
  output_dir: runs/homogeneous_ratio30/FedProxy/_template
  reuse_artifacts_from: null
  reuse_model_relocation: null
  reuse_compression_from: runs/homogeneous_ratio30/shared
  adapter_initialization_seed: 42
compression:
  remove_ratio: 0.30
data:
  max_target_length: 128
federated:
  client_execution: parallel
  max_parallel_clients: 0
ma:
  enabled: false
