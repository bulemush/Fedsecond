extends: base.yaml
run:
  name: smoke
  output_dir: runs/smoke
  synthetic: true
model:
  family: llama
  name_or_path: synthetic-tiny-llama
compression:
  calibration_samples: 4
  calibration_max_length: 16
data:
  scenario: heterogeneous
  tasks: [synthetic_a, synthetic_b]
  num_clients: 2
  max_train_samples_per_task: 4
lora:
  r: 2
  alpha: 4
  dropout: 0.0
training:
  local_epochs: 1
  effective_batch_size: 2
  micro_batch_size: 2
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
federated:
  rounds: 2
smoke_model:
  vocab_size: 64
  hidden_size: 32
  intermediate_size: 64
  num_hidden_layers: 4
  num_attention_heads: 4
  num_key_value_heads: 2

